name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

# Standalone build (hybrid CI): fm-robot builds its own packages plus the two
# externals it genuinely consumes — openarm_description (xacro) and the
# unitree_ros2 message packages (fm_control depends on unitree_hg + unitree_api).
# Every other external is file-vendored or reference-only and is COLCON_IGNORE'd.
# unitree_ros (G1) and so_arm (SO101) are file-vendored into fm_description's
# share at build, so they must be imported even though they are not built — the
# fm_description description smoke test launches every robot and variant against
# that vendored share. The full multi-repo integration build lives in fm-ros2.
jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # The piped-curl front door check lives in first-motive/.github.
  selftest:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main

  # The colcon block lives in first-motive/.github. openarm_description (xacro) and
  # the unitree_ros2 message packages are the two externals genuinely built here;
  # everything else the manifest imports is file-vendored or reference-only.
  build-test:
    uses: first-motive/.github/.github/workflows/ros2-build-test.yml@main
    with:
      checkout-path: src/fm-robot
      repos-file: fm-robot.repos
      build-externals: openarm_description unitree_ros2
      apt-packages: >-
        ros-humble-rosidl-generator-dds-idl ros-humble-cyclonedds ros-humble-rmw-cyclonedds-cpp

  image:
    name: build + publish image (FROM fm-docker base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Pin a recent qemu: the default ships an older build whose arm64 user-mode
      # emulation segfaults on heavy glibc postinst — libc-bin's ldconfig dies with
      # SIGSEGV and the layer fails with exit 100. fm-teleop hit this first and
      # pinned; this repo did not, and the next apt layer added here (#37) tripped
      # over it. Newer qemu emulates that path cleanly.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      # Log in to GHCR — to pull the private base FROM and to push this layer.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build multi-arch (arm64 + amd64). Publish to GHCR only on main — branch and
      # PR runs build to validate without pushing. Downstream repos (fm-sim,
      # fm-teleop, fm-app) pull this as their FROM base, so the GHCR package must be
      # set public once it first publishes.
      - name: Build + publish the robot image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/first-motive/fm-robot:humble
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The smoke asserts the description view reached a working state, rather than that
  # the process was still alive when a timer fired. run.sh is still the thing under
  # test — it stays the launch command, so the front door keeps its coverage.
  #
  # With both viewers off, use_jsp_gui:=auto resolves to the headless
  # joint_state_publisher, which seeds the home pose and publishes /joint_states.
  # That topic assert is the one a silent stack cannot pass.
  #
  # No controller assert here: fm-robot owns the ros2_control xacros but ships no
  # launch that spawns a controller_manager. Controllers reach `active` under
  # fm_bringup, so that assert lives in fm-app and in fm-ros2's ci-smoke.sh.
  smoke:
    name: smoke run.sh (native headless)
    uses: first-motive/.github/.github/workflows/ros2-smoke.yml@main
    with:
      repos-file: fm-robot.repos
      build-externals: openarm_description unitree_ros2
      apt-packages: >-
        ros-humble-rosidl-generator-dds-idl
        ros-humble-cyclonedds ros-humble-rmw-cyclonedds-cpp
      launch: ./run.sh --native --robot g1_d use_rviz:=false use_foxglove:=false
      expect-nodes: /joint_state_publisher /robot_state_publisher
      expect-topics: /joint_states
